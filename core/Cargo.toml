[package]
name = "christy"
version = "0.1.0"
edition = "2021"
description = "Personal CLI ecosystem: one entry point for personal tools"

[[bin]]
name = "christy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
